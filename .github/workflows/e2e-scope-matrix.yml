name: E2E scope matrix check (throwaway tenant)

# Tests that the SCOPE dropdown on a role permission (Only themselves / Their team / Their
# department / Their branch / Whole company) actually restricts what a person can see, not
# just that the permission exists. Runs only against the throwaway zzz-playwright-test
# tenant — never against a real company — and creates a small deterministic org structure
# there to compare scope levels against.
on:
  workflow_dispatch: {}
  push:
    branches: ['test/e2e-playwright-ci']
    paths: ['.github/workflows/e2e-scope-matrix.yml', 'e2e/RUN_SCOPE_TRIGGER']

permissions:
  contents: write

jobs:
  scope-matrix:
    runs-on: ubuntu-latest
    env:
      PROD_API_BASE: ${{ secrets.PROD_API_BASE }}
      PROD_SUPERADMIN_USER: ${{ secrets.PROD_SUPERADMIN_USER }}
      PROD_SUPERADMIN_PASS: ${{ secrets.PROD_SUPERADMIN_PASS }}
      E2E_EMAIL: qa-admin@workpilot-test.com
      E2E_PASSWORD: TestPass123!
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check required secrets are set
        run: |
          if [ -z "$PROD_API_BASE" ] || [ -z "$PROD_SUPERADMIN_USER" ] || [ -z "$PROD_SUPERADMIN_PASS" ]; then
            echo "Missing PROD_API_BASE / PROD_SUPERADMIN_USER / PROD_SUPERADMIN_PASS repo secrets."
            exit 1
          fi

      - name: Install e2e deps
        working-directory: e2e
        run: npm install

      - name: Run scope matrix test
        id: run
        working-directory: e2e
        run: node scripts/scope-matrix-test.js
        continue-on-error: true

      - name: Build commit comment
        if: always()
        working-directory: e2e
        run: |
          {
            echo "## Scope matrix test results"
            echo
            echo '```'
            cat scope-matrix-report.log 2>/dev/null || echo "(no report produced)"
            echo '```'
          } > ../summary.md

      - name: Publish commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat summary.md)"

      - name: Fail the job if the scope test found a mismatch
        if: steps.run.outcome == 'failure'
        run: exit 1
