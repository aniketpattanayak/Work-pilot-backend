name: E2E live UI test

on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PORT: 5001
      MONGO_URI: mongodb://127.0.0.1:27017/workpilot_e2e
      JWT_SECRET: e2e-test-secret-not-for-production
      SUPERADMIN_USER: admin_lalit
      SUPERADMIN_PASS: Lalit@WorkPilot2026
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: aniketpattanayak/Work-pilot-frontend
          path: frontend

      - name: Make wp-qa-test.localhost resolve locally
        run: echo "127.0.0.1 wp-qa-test.localhost" | sudo tee -a /etc/hosts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        run: npm ci

      - name: Start backend
        run: nohup npm start > backend.log 2>&1 &

      - name: Wait for backend
        run: npx --yes wait-on tcp:127.0.0.1:5001 -t 60000 || (cat backend.log && exit 1)

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        # axiosConfig.js defaults to http://localhost:5000/api when VITE_API_URL isn't set —
        # the backend here runs on 5001, so without this every API call (including the
        # tenant-verify call the login page waits on) silently fails and the page hangs.
        run: nohup npx vite --host 0.0.0.0 --port 5173 > ../frontend.log 2>&1 &
        env:
          VITE_API_URL: http://127.0.0.1:5001/api

      - name: Wait for frontend
        run: npx --yes wait-on tcp:127.0.0.1:5173 -t 60000 || (cat frontend.log && exit 1)

      - name: Diagnose connectivity before running tests
        run: |
          echo "--- /etc/hosts ---" | tee diag.log
          cat /etc/hosts | tee -a diag.log
          echo "--- curl backend root ---" | tee -a diag.log
          curl -sS -m 5 -i http://127.0.0.1:5001/ 2>&1 | tee -a diag.log || true
          echo "--- curl frontend via plain localhost ---" | tee -a diag.log
          curl -sS -m 5 -i http://127.0.0.1:5173/ 2>&1 | tee -a diag.log || true
          echo "--- curl frontend via wp-qa-test.localhost ---" | tee -a diag.log
          curl -sS -m 5 -i http://wp-qa-test.localhost:5173/ 2>&1 | tee -a diag.log || true

      - name: Install e2e deps
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run live UI tests
        working-directory: e2e
        run: npx playwright test
        continue-on-error: true
        env:
          E2E_API_BASE: http://127.0.0.1:5001/api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log

      # The results-receiver / blob-storage hosts that serve raw logs and artifacts aren't
      # reachable from Claude's sandbox, so post a plain-text summary as a commit comment
      # instead — that goes through api.github.com, which Claude can read directly.
      # (Kept as a real .js file, not an inline `node -e "..."`: backticks used for the
      # markdown code fences were being eaten by the shell inside a double-quoted string.)
      - name: Post results summary as a commit comment
        if: always()
        working-directory: e2e
        run: node scripts/post-summary.js
        continue-on-error: true

      - name: Publish commit comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(cat summary.md)"

      - name: Fail the job if any test failed
        if: always()
        working-directory: e2e
        run: |
          node -e "
            const fs = require('fs');
            const r = JSON.parse(fs.readFileSync('playwright-report/results.json', 'utf8'));
            let failed = false;
            const walk = (suite) => {
              (suite.suites || []).forEach(walk);
              (suite.specs || []).forEach(spec => spec.tests.forEach(t => {
                const s = t.results[t.results.length - 1].status; if (s !== 'passed' && s !== 'skipped') failed = true;
              }));
            };
            walk(r);
            process.exit(failed ? 1 : 0);
          "
