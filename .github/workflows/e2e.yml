name: E2E live UI test

on:
  push:
    branches: [main, 'test/**']
  workflow_dispatch: {}

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6
        ports: ['27017:27017']
    env:
      PORT: 5001
      MONGO_URI: mongodb://127.0.0.1:27017/workpilot_e2e
      JWT_SECRET: e2e-test-secret-not-for-production
      SUPERADMIN_USER: admin_lalit
      SUPERADMIN_PASS: Lalit@WorkPilot2026
    steps:
      - name: Checkout backend
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: aniketpattanayak/Work-pilot-frontend
          path: frontend

      - name: Make wp-qa-test.localhost resolve locally
        run: echo "127.0.0.1 wp-qa-test.localhost" | sudo tee -a /etc/hosts

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        run: npm ci

      - name: Start backend
        run: nohup npm start > backend.log 2>&1 &

      - name: Wait for backend
        run: npx --yes wait-on tcp:127.0.0.1:5001 -t 60000 || (cat backend.log && exit 1)

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        run: nohup npx vite --host 0.0.0.0 --port 5173 > ../frontend.log 2>&1 &

      - name: Wait for frontend
        run: npx --yes wait-on tcp:127.0.0.1:5173 -t 60000 || (cat frontend.log && exit 1)

      - name: Install e2e deps
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run live UI tests
        working-directory: e2e
        run: npx playwright test
        env:
          E2E_API_BASE: http://127.0.0.1:5001/api

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs
          path: |
            backend.log
            frontend.log
